version: 2
updates:
  # Image dasar aplikasi (app/Dockerfile): tag + digest dinaikkan bersama
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "Docker"

  # Image monitoring (monitoring/compose.yaml): satu PR untuk semua
  - package-ecosystem: docker-compose
    directory: /monitoring
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "Monitoring"
    groups:
      monitoring:
        patterns: ["*"]

  # Action GitHub di workflow (actions/checkout, azure/setup-helm)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]
