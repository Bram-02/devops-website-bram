name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Ambil kode (seluruh riwayat)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cek rahasia (Gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo -v
