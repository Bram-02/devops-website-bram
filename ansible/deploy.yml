- name: Deploy website ke k3s
  hosts: k3s
  vars:
    image_tag: latest
    kubeconfig_deployer: "{{ lookup('env', 'HOME') }}/.kube/deployer"
    batas_hari_sertifikat: 7
    cosign_image: ghcr.io/sigstore/cosign/cosign:v3.1.4
    cosign_identitas: "https://github.com/Bram-02/devops-website-bram/.github/workflows/ci.yml@refs/heads/main"
  environment:
    KUBECONFIG: "{{ kubeconfig_deployer }}"
  tasks:
    - name: Pastikan k3s menyala
      become: true
      ansible.builtin.systemd:
        name: k3s
        state: started

    - name: Periksa kubeconfig deployer
      ansible.builtin.stat:
        path: "{{ kubeconfig_deployer }}"
      register: kunci_deployer

    - name: Hentikan kalau kubeconfig deployer belum ada
      ansible.builtin.fail:
        msg: "Kubeconfig deployer belum ada. Jalankan dulu: ansible-playbook -i ansible/inventory.ini ansible/token-deployer.yml"
      when: not kunci_deployer.stat.exists

    - name: Tunggu API server siap
      ansible.builtin.command: kubectl get --raw /readyz
      register: siap
      until: siap.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: Verifikasi tanda tangan image (cosign keyless, hanya dari CI main)
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - "{{ cosign_image }}"
          - verify
          - "ghcr.io/bram-02/devops-website-bram:{{ image_tag }}"
          - --certificate-identity
          - "{{ cosign_identitas }}"
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
      changed_when: false

    - name: Isi template manifest dengan versi image
      ansible.builtin.template:
        src: ../k8s/website.yaml.j2
        dest: /tmp/website.yaml
        mode: "0644"

    - name: Cek perbedaan manifest dengan cluster
      ansible.builtin.command: kubectl diff -f /tmp/website.yaml
      register: hasil_diff
      changed_when: false
      failed_when: false

    - name: Tampilkan perbedaan (atau error diff)
      ansible.builtin.debug:
        msg: "{{ hasil_diff.stdout_lines if hasil_diff.rc == 1 else hasil_diff.stderr_lines }}"
      when: hasil_diff.rc != 0

    - name: Terapkan manifest
      ansible.builtin.command: kubectl apply -f /tmp/website.yaml
      when: hasil_diff.rc != 0
      changed_when: true

    - name: Tunggu rolling update selesai
      ansible.builtin.command: kubectl rollout status deployment/website -n website --timeout=180s
      changed_when: false

    - name: Tunggu sertifikat HTTPS siap
      ansible.builtin.command: kubectl wait --for=condition=Ready certificate/website-tls -n website --timeout=120s
      changed_when: false

    - name: Ambil masa berlaku sertifikat
      ansible.builtin.command: kubectl get certificate website-tls -n website -o jsonpath={.status.notAfter}
      register: sertifikat
      changed_when: false

    - name: Hitung sisa hari sertifikat
      ansible.builtin.set_fact:
        sisa_hari: "{{ ((sertifikat.stdout | to_datetime('%Y-%m-%dT%H:%M:%SZ')) - (ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).days }}"

    - name: Pastikan sertifikat tidak hampir habis
      ansible.builtin.assert:
        that: sisa_hari | int >= batas_hari_sertifikat | int
        fail_msg: >-
          Sertifikat website-tls habis dalam {{ sisa_hari }} hari, batas {{ batas_hari_sertifikat }} hari
          ({{ sertifikat.stdout }}). Periksa: kubectl describe certificate website-tls -n website
        success_msg: "Sertifikat website-tls Ready, berlaku sampai {{ sertifikat.stdout }} ({{ sisa_hari }} hari lagi)"

    - name: Ambil daftar pod
      ansible.builtin.command: kubectl get pods -n website -o custom-columns=POD:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image
      register: daftar_pod
      changed_when: false

    - name: Tampilkan pod
      ansible.builtin.debug:
        var: daftar_pod.stdout_lines
