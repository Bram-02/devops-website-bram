- name: Platform k3s (lapisan 2) - cert-manager dan CA lab
  hosts: k3s
  vars:
    cert_manager_version: v1.21.3
    ca_dir: "{{ lookup('env','HOME') }}/lab-ca"
  environment:
    KUBECONFIG: "{{ lookup('env','HOME') }}/.kube/config"
  tasks:
    - name: Periksa CA lab (disimpan di luar repository)
      ansible.builtin.stat:
        path: "{{ ca_dir }}/ca.key"
      register: ca_key

    - name: Hentikan kalau CA lab belum dibuat
      ansible.builtin.fail:
        msg: "CA lab belum ada di {{ ca_dir }}. Buat dulu dengan openssl (lihat README)."
      when: not ca_key.stat.exists

    - name: Pasang cert-manager (Helm, versi dikunci)
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: cert-manager
        chart_repo_url: https://charts.jetstack.io
        chart_version: "{{ cert_manager_version }}"
        release_namespace: cert-manager
        create_namespace: true
        values:
          crds:
            enabled: true
        wait: true
        wait_timeout: 10m

    - name: Secret CA lab untuk ClusterIssuer
      ansible.builtin.shell: >
        kubectl create secret tls lab-ca -n cert-manager
        --cert={{ ca_dir }}/ca.crt --key={{ ca_dir }}/ca.key
        --dry-run=client -o yaml | kubectl apply -f -
      register: secret_ca
      changed_when: "'created' in secret_ca.stdout or 'configured' in secret_ca.stdout"
      no_log: true

    - name: ClusterIssuer lab-ca
      ansible.builtin.command: kubectl apply -f {{ playbook_dir }}/../k8s/cluster-issuer.yaml
      register: issuer
      changed_when: "'created' in issuer.stdout or 'configured' in issuer.stdout"

    - name: Tunggu ClusterIssuer siap
      ansible.builtin.command: kubectl wait --for=condition=Ready clusterissuer/lab-ca --timeout=60s
      changed_when: false
