replicaCount: 3
image:
  repository: ghcr.io/bram-02/devops-website-bram
  tag: ""
host: helm.website.localhost
infoVersi: "1"
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
ingress:
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  denyEgress: true
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
